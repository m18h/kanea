# golangci-lint configuration (v2 format).
# Security gates (gosec) are also run standalone via `make security` — this
# config is the general lint gate. See AGENTS.md "Coding conventions".
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - depguard      # ban stdlib "log" (use log/slog via internal/logging)
    - errcheck      # unchecked errors
    - errorlint     # proper %w / errors.Is/As usage
    - forbidigo     # ban direct fmt.Print* (CLI output goes through fmt.Fprint*(w))
    - gocritic      # opinionated correctness/style checks
    - gosec         # security (belt-and-braces with the standalone gate)
    - misspell      # typos
    - revive        # style + exported-docs
    - staticcheck   # SA/S/ST/QF checks
    - unconvert     # needless conversions
    - unparam       # unused params/results
    - unused        # dead code
  settings:
    errcheck:
      check-blank: true
    depguard:
      rules:
        stdlib-log:
          files:
            - "**/*.go"
          deny:
            - pkg: log$
              desc: use log/slog via github.com/m18h/kanea/internal/logging (AGENTS.md conventions)
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print
          msg: components log via injected *slog.Logger (internal/logging); CLI output uses fmt.Fprint*(os.Stdout/os.Stderr, ...)
  exclusions:
    generated: lax
    # node_modules ships Go source in a few npm packages (flatted, for one).
    # It is vendored third-party code that is never built into kanea, so
    # linting it reports problems nobody here can fix.
    paths:
      - node_modules
      - dashboard/node_modules
      # bpf2go output (committed, regenerated only by `make bpf` under the
      # digest-pinned toolchain). `generated: lax` already skips it by its
      # header; the explicit path is belt-and-braces, because a lint issue
      # in a generated file has no fix except upstream.
      - internal/datapath/bpf/kanea_.*\.go$
    rules:
      # Tests may ignore errors and use lax patterns. unparam is excluded too:
      # a test helper spells out its arguments so the call site reads as a
      # sentence ("backendsOf(shop, web)"), which is worth keeping even while
      # every current caller passes the same project.
      - path: _test\.go
        linters: [errcheck, gosec, forbidigo, depguard, unparam]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
