# Release (PRD §14 A08, §20).
#
# The binary this publishes runs as root on someone's node with access to every
# container and every secret on it. So the artefacts are signed, and the
# signature is keyless: a long-lived signing key in a repository secret is a
# credential that has to be rotated, guarded and eventually leaked, whereas
# Sigstore binds the signature to *this workflow in this repository* and the
# proof is in a public transparency log.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    # No contents/id-token permission: this job installs and runs third-party
    # tool code, and it must not run beside the step that signs every node's
    # binary (K-42). The signing job re-checks out and builds from scratch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gate tools
        run: |
          make tools
          # Not in `make tools` (locally it comes from a package manager), but
          # it is a Go module and the runner has the toolchain already. The
          # module still declares the pre-org-move path, hence zricethezav.
          # Pinned like the rest (K-42): a gate tool at @latest is unreviewed
          # code in the release pipeline.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Gates
        run: make check

  build:
    name: Build and publish
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The OIDC token cosign exchanges for a short-lived certificate. This is
      # what makes the signature attributable without a key to look after.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags and full history: the version stamp is derived from them, and a
          # shallow clone would produce a binary that reports the wrong one.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The dashboard build runs here too: go:embed picks it up into the
      # binaries. The gates job already proved the tree; this job signs it.
      - name: Dashboard
        run: make dashboard

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # The darwin archives are the CLI half (PRD §5.2.12, v1.60): spec
          # authoring and validation on a Mac, via the Homebrew formula. The
          # daemons stay Linux; nothing else about the release changes: the
          # checksums glob below covers these too, so the one cosign signature
          # extends over them with no second signing step.
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            echo "building ${os}/${arch}"
            # CGO off: the whole premise is one static binary that runs on any
            # glibc or musl host without a runtime dependency to chase.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/kanea" ./cmd/kanea
            tar -C dist -czf "dist/kanea_${VERSION#v}_${os}_${arch}.tar.gz" kanea
            rm dist/kanea
          done

      # Offline bundles (PRD §5.2.12). An air-gapped node is a supported
      # installation, so the artefacts it needs are published rather than left
      # for an operator to assemble from a wiki page.
      #
      # containerd has to be running to export the image components, so the
      # binary built above installs it, which also means every release
      # exercises `kanea install` end to end before the binary is published.
      - name: Build the offline bundles
        run: |
          set -euo pipefail

          # The two commands below are the only ones in this job that depend
          # on a third party's network weather: the install fetches upstream
          # release archives, and the bundle exports an image from Docker Hub.
          # A CDN connection reset mid-pull failed the v0.23.0 release with
          # nothing wrong with the code, so each gets three attempts with a
          # widening pause. Every retry is announced and the last failure is
          # still a failure: this hides a flaky network, never a broken build.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::failed after $attempt attempts: $*"
                return 1
              fi
              echo "::warning::attempt $attempt failed, retrying: $*"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          tar -C dist -xzf "dist/kanea_${VERSION#v}_linux_amd64.tar.gz"
          retry sudo ./dist/kanea install --only containerd,runc
          sudo systemctl daemon-reload
          sudo systemctl enable --now kanea-containerd.service
          for arch in amd64 arm64; do
            retry sudo ./dist/kanea bundle create --arch "$arch" \
              -o "dist/kanea_${VERSION#v}_linux_${arch}_bundle.tar.gz"
          done
          sudo chown "$(id -u):$(id -g)" dist/*_bundle.tar.gz
          rm dist/kanea
          ls -lh dist/
        env:
          VERSION: ${{ github.ref_name }}

      # The SBOMs (PRD §14 A06, §21). They are written here, between the
      # archives and the checksums, so the manifest below covers them and the
      # one cosign signature over it extends to them too: the same reasoning
      # that puts the bundles under it. An SBOM nobody can authenticate
      # describes software nobody can authenticate.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.51.0

      - name: SBOMs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/sbom.sh dist "$VERSION"
          ls -lh dist/*.spdx.json

      - name: Checksums
        run: |
          cd dist
          # No leading "./" on the names: scripts/install.sh selects its line
          # with `grep " <archive>$"`, and "  ./kanea_…" would not match.
          #
          # The bundles and the SBOMs are covered here too, so the existing
          # cosign signature over this file extends to them with no second
          # signing step: one signature over a manifest of hashes, as the
          # header says. Both patterns are named rather than collapsed to
          # `kanea_*`: what belongs in a release is a decision, not whatever
          # happens to be in the directory.
          sha256sum kanea_*.tar.gz kanea_*.spdx.json > checksums.txt
          cat checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Only checksums.txt is signed, and every archive is covered by it. One
      # signature over a manifest of hashes is the same guarantee as a signature
      # per artefact, with one thing to verify instead of N.
      - name: Sign the checksums
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          cosign sign-blob \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Verify what we are about to publish
        run: |
          cd dist
          # The same verification scripts/install.sh performs. Running it here
          # means a signature that cannot be verified fails the release rather
          # than every installation.
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          sha256sum -c checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.spdx.json \
            dist/checksums.txt dist/checksums.txt.sig dist/checksums.txt.pem

  # The container image (PRD §5.2.12, v1.88): the CLI for a pipeline that
  # deploys to a node, never the node itself.
  #
  # It runs AFTER the signing job and takes its binaries from what that job
  # published, rather than compiling its own. That is the whole design: a
  # `go build` inside the Containerfile would be simpler to write and would
  # mean the checksums.txt every user verifies described bytes nobody ships.
  # As built, the signed manifest of hashes covers the image's contents, which
  # is v1.30's bundle argument pointed at a registry.
  #
  # Its own job for K-42's reason, unchanged: a registry push credential does
  # not belong beside `cosign sign-blob`.
  #
  # The consequence of running after `build` is that the GitHub release already
  # exists when this starts, so a failure here leaves a published release with
  # no image rather than rolling anything back. That is the right way round:
  # re-running this job fixes it, and the alternative (publish last) would mean
  # the image could not be built from the release's own verified assets, which
  # is the property the whole job exists for.
  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release download
      packages: write # ghcr.io/<this repository>
      id-token: write # the same keyless cosign identity as checksums.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The apk step in the Containerfile runs on the target platform, so the
      # arm64 half needs emulation. The binaries themselves never execute
      # during the build; they are copied.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      # Exactly what scripts/install.sh does, in its order: the signature over
      # checksums.txt first, then each archive against checksums.txt. An
      # archive that fails either check must not reach an image that carries
      # this repository's name.
      - name: Fetch and verify the released binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          # Named one by one rather than globbed: "kanea_*_linux_*.tar.gz"
          # also matches the offline bundles, which are not this.
          gh release download "$TAG" -D dist \
            -p "kanea_${V}_linux_amd64.tar.gz" \
            -p "kanea_${V}_linux_arm64.tar.gz" \
            -p checksums.txt -p checksums.txt.sig -p checksums.txt.pem
          cd dist
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
          for arch in amd64 arm64; do
            archive="kanea_${V}_linux_${arch}.tar.gz"
            # The leading space is load-bearing (install.sh:96): it anchors the
            # name to a whole field rather than to a suffix of one.
            grep " ${archive}\$" checksums.txt | sha256sum -c -
            mkdir -p "image/${arch}"
            tar -C "image/${arch}" -xzf "$archive"
            test -x "image/${arch}/kanea"
          done
          # The build context is these two files and nothing else: the
          # repository is never handed to the builder.
          find image -type f

      - name: Resolve the image reference and tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Lowercased because a registry reference has to be, and an owner
          # with a capital letter is a push that fails on the last step.
          repo="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo}"
          tags="--tag ${image}:${TAG}"
          # `latest` moves only for a plain vX.Y.Z. The anchored pattern is the
          # point: sbom.sh's glob accepts a tag like v1.0.0-rc1, which is fine
          # for a filename check and wrong here, because a prerelease that
          # takes `latest` is a prerelease everyone pulls by default.
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            tags="${tags} --tag ${image}:latest"
          else
            echo "::notice::${TAG} is not a plain vX.Y.Z; leaving :latest where it is"
          fi
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "TAGS=${tags}" >> "$GITHUB_ENV"

      # Plain `docker login` rather than an action: one less piece of
      # third-party code in the job that holds a push credential.
      - name: Log in to ghcr.io
        run: |
          printf '%s' "${{ github.token }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The default "docker" driver cannot produce a manifest list.
          docker buildx create --use --name kanea-release
          # --metadata-file for the digest: the same idiom internal/gitops
          # reads containerimage.digest out of buildctl with.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Containerfile \
            --build-arg VERSION="${TAG}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --metadata-file dist/image-meta.json \
            --push $TAGS \
            dist/image
          digest="$(jq -er '."containerimage.digest"' dist/image-meta.json)"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "pushed ${IMAGE}@${digest}"

      # The digest, not a tag: a tag is a mutable pointer, and signing one
      # signs whatever it happens to name later.
      - name: Sign the image
        env:
          COSIGN_YES: "true"
        run: cosign sign "${IMAGE}@${DIGEST}"

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.51.0

      # An SBOM here, unlike for the offline bundles: those are skipped because
      # syft cannot descend into the archives they carry and would describe an
      # empty bundle, and an image is exactly what it reads well (§14 A06).
      - name: Attest an SBOM
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # --platform stated rather than left to the runner: syft resolves a
          # manifest list to whatever it is running on, and a document whose
          # contents depend on the runner's architecture is a document that
          # changes for a reason nobody can see. The two variants differ only
          # in the one binary; the package set is the same base either way.
          syft scan --platform linux/amd64 "registry:${IMAGE}@${DIGEST}" \
            -o spdx-json=dist/image.spdx.json -q
          cosign attest --type spdxjson --predicate dist/image.spdx.json "${IMAGE}@${DIGEST}"

      # The build job verifies what it is about to publish; this one verifies
      # what it just did. A signature that cannot be verified should fail the
      # release rather than every `cosign verify` a user runs afterwards, and
      # an image that does not start should fail it rather than every pipeline
      # that pulls it.
      - name: Verify what we just pushed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            >/dev/null
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          test "$(docker run --rm "${IMAGE}@${DIGEST}" version)" = "kanea ${TAG}"

  # The Homebrew formula moved to its own tap repository (PRD §5.2.12,
  # v1.67): m18h/homebrew-kanea polls this repository's releases and bumps
  # itself; the release workflow writes only to this repository, and no
  # cross-repo credential exists.
