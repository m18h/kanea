# CI: all gates mirror `make check` locally. Security gates are release
# gates (AGENTS.md constraint #7): they may never be skipped or made
# non-blocking.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: "Go: build, vet, test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -trimpath ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        # An explicit timeout: internal/api under -race sits near Go's implicit
        # 10-minute per-package default on hosted runners, and a suite that
        # grows must fail on a real regression, not on the clock.
        run: go test ./... -race -count=1 -timeout 20m

  s3-interop:
    # The S3 client is hand-written (PRD v1.27), and a fake server that does not
    # verify signatures accepts a broken signer as happily as a correct one. This
    # job is the only thing establishing that the signature is one a service will
    # take: it found a body-ownership bug the unit tests structurally could not.
    name: "S3 interop: MinIO"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # Started as a step rather than a `services:` container: MinIO's image
      # needs `server /data` as its command, and service containers cannot
      # supply one.
      #
      # Pinned by digest, like every other third-party artefact the build
      # depends on: this job's whole job is to detect a signature the service
      # rejects, and ":latest" makes "the service changed" and "we changed"
      # indistinguishable on the morning it starts failing.
      #
      # MINIO_DOMAIN is what enables virtual-hosted addressing below.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=kaneatest \
            -e MINIO_ROOT_PASSWORD=kaneatestsecret \
            -e MINIO_DOMAIN=localhost \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is up"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1

      - name: Interoperability tests; path-style
        env:
          KANEA_S3_ENDPOINT: http://127.0.0.1:9000
          KANEA_S3_ACCESS_KEY: kaneatest
          KANEA_S3_SECRET_KEY: kaneatestsecret
        run: go test ./internal/backup/ -run Live -count=1 -v

      # The other addressing style, and it is a different signature rather than
      # a different URL: virtual-hosted puts the bucket in the *host* header,
      # which is signed. It is what AWS prefers and what an operator gets by
      # omitting `endpoint`, so leaving it unexercised meant the addressing half
      # of what Archiver.Probe claims to prove had never run against a service
      # that verifies.
      #
      # The bucket subdomain is resolved through /etc/hosts rather than by
      # trusting the runner to synthesise *.localhost: whether it does is a
      # systemd-resolved detail, and a required job must not rest on one.
      - name: Interoperability tests; virtual-hosted
        env:
          KANEA_S3_ENDPOINT: http://localhost:9000
          KANEA_S3_PATH_STYLE: "false"
          KANEA_S3_ACCESS_KEY: kaneatest
          KANEA_S3_SECRET_KEY: kaneatestsecret
        run: |
          echo "127.0.0.1 kanea-test.localhost" | sudo tee -a /etc/hosts
          go test ./internal/backup/ -run Live -count=1 -v

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio

  manifest-verify:
    # The component manifest pins every host component by SHA-256 (PRD §5.2.12),
    # and those hashes are compiled into a binary that runs as root. This job
    # asks the only question the unit tests cannot: do the artefacts upstream
    # still hash to what we pinned?
    #
    # A failure here is not a broken build; it means an upstream project
    # re-tagged a release, which is exactly the event the pinning exists to
    # catch and exactly the one nobody would otherwise notice.
    name: "Component manifest: upstream hashes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o ./bin/kanea ./cmd/kanea
      # --dry-run downloads and verifies every artefact and writes nothing.
      # Both architectures, because a hash is per-arch and half a matrix
      # verified is a matrix that fails on somebody else's node.
      - name: Verify every pinned artefact
        run: |
          set -euo pipefail
          ./bin/kanea install --list
          for arch in amd64 arm64; do
            echo "== $arch"
            ./bin/kanea install --dry-run --arch "$arch"
          done

  bpf-verify:
    # The datapath's BPF artifacts are committed bpf2go output (PRD v1.36
    # §5.2.5): `go build` needs no clang, and generation happens only under
    # the digest-pinned toolchain container via `make bpf`. This job
    # regenerates and diffs, so it asks the one question the build cannot:
    # do the committed artifacts still come from the committed sources?
    #
    # A failure here means someone edited a generated file by hand, or
    # edited kanea.c/headers.h without running `make bpf`; both are the
    # drift the committed-artifact scheme exists to catch.
    name: "BPF artifacts: regenerate and diff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerate and diff
        run: make bpf-verify

  # The kernel floor is NOT exercised in CI (PRD §21: "kernel ≥ 5.10; the floor
  # is spike-validated, not inherited"). internal/datapath's bpfload-tagged test
  # loads the shipping object and verifies all four programs and sixteen maps;
  # but it needs a 5.10 kernel to mean anything, and the attempt to boot one here
  # through cilium/little-vm-helper could not be made to work: the action fetches
  # the image and then hands lvh the qcow2 path where it expects a registry
  # reference. Rather than leave a check permanently red, which teaches people to
  # stop reading the checks, the same argument bpf-verify's neighbour makes about
  # flaky required jobs; the floor is verified on a real Debian 11 node as part of
  # the spike ⑤ run (spikes/ebpf-datapath, docs/VALIDATION.md §3):
  #
  #     sudo -E go test -tags bpfload -run Floor -v ./internal/datapath/
  #
  # If this is ever automated, the thing to get right is the lvh/action version
  # pairing, not the inputs.

  install-smoke:
    # `kanea install` places binaries, writes units and starts daemons. None of
    # that can be tested off a real Linux host, and the S3 `Put` defect in
    # AGENTS.md is the standing reminder of what a fake server does not catch.
    name: "Install smoke: real node"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o ./bin/kanea ./cmd/kanea
      # The datapath is left out deliberately: it needs BPF features a hosted
      # runner does not reliably have, and a flaky required job teaches people
      # to ignore CI. The dataplane is exercised on a real node instead
      # (§20 M10): the same reasoning that kept cilium out before it.
      - name: Install the host components
        run: sudo ./bin/kanea install --only containerd,runc,buildkit
      - name: The sockets answer
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet kanea-containerd.service
          # sudo because /run/kanea is 0710 root:root (Layout.Directories); an
          # unprivileged stat cannot traverse it, and the socket being root-only
          # is the design, not the defect under test.
          sudo test -S /run/kanea/containerd.sock
          sudo /usr/local/lib/kanea/bin/ctr --address /run/kanea/containerd.sock version
      # The coexistence promise, tested rather than asserted: the runner's own
      # containerd (Docker's) must be untouched and still on its own socket.
      - name: A pre-existing containerd is untouched
        run: |
          set -euo pipefail
          sudo test -S /run/containerd/containerd.sock
          docker run --rm hello-world >/dev/null
          echo "the distribution's containerd still serves Docker"
      - name: Constraint #11; every unit joined kanea.slice
        run: |
          set -euo pipefail
          for unit in kanea-containerd; do
            slice=$(systemctl show -p Slice --value "$unit.service")
            [ "$slice" = "kanea.slice" ] || { echo "$unit is in $slice"; exit 1; }
          done
      # Presence-by-name is not verification: containerd names imported image
      # records from the archive's own annotation, so a crafted bundle can
      # claim the pinned name while targeting other content. Fetch's digest
      # comparison is the authority check, and this forges the exact bundle
      # that defeats a name lookup.
      - name: A bundle whose image claims the pinned name is refused
        run: |
          set -euo pipefail
          sudo ./bin/kanea bundle create --arch amd64 -o bundle-full.tar.gz
          mkdir -p forged && tar -C forged -xzf bundle-full.tar.gz
          ref="$(jq -r '.components[] | select(.name=="buildkit") | .image + "@" + .digest' internal/provision/components.json)"
          REF="$ref" python3 - <<'PY'
          import hashlib, io, json, os, tarfile
          def blob(data): return hashlib.sha256(data).hexdigest(), data
          config = json.dumps({"architecture":"amd64","os":"linux","config":{}}).encode()
          cd, cdata = blob(config)
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w") as t:
              payload = b"not the pinned buildkit\n"
              ti = tarfile.TarInfo("usr/bin/buildkitd"); ti.size = len(payload); ti.mode = 0o755
              t.addfile(ti, io.BytesIO(payload))
          ld, ldata = blob(buf.getvalue())
          manifest = json.dumps({"schemaVersion":2,
              "mediaType":"application/vnd.oci.image.manifest.v1+json",
              "config":{"mediaType":"application/vnd.oci.image.config.v1+json",
                        "digest":"sha256:"+cd,"size":len(cdata)},
              "layers":[{"mediaType":"application/vnd.oci.image.layer.v1.tar",
                         "digest":"sha256:"+ld,"size":len(ldata)}]}).encode()
          md, mdata = blob(manifest)
          index = json.dumps({"schemaVersion":2,
              "mediaType":"application/vnd.oci.image.index.v1+json",
              "manifests":[{"mediaType":"application/vnd.oci.image.manifest.v1+json",
                            "digest":"sha256:"+md,"size":len(mdata),
                            "annotations":{"org.opencontainers.image.ref.name":os.environ["REF"]}}]}).encode()
          with tarfile.open("forged/images/buildkit.oci.tar","w") as t:
              def add(name, data):
                  ti = tarfile.TarInfo(name); ti.size = len(data); ti.mode = 0o644
                  t.addfile(ti, io.BytesIO(data))
              add("oci-layout", json.dumps({"imageLayoutVersion":"1.0.0"}).encode())
              add("index.json", index)
              add("blobs/sha256/"+cd, cdata)
              add("blobs/sha256/"+ld, ldata)
              add("blobs/sha256/"+md, mdata)
          PY
          # Install into a clean prefix: the real-node job's earlier steps
          # already installed buildkit, and the up-to-date receipt check would
          # skip Fetch - and with it the digest comparison - entirely. The
          # forged archive still imports into the node's shared containerd;
          # the refusal comes from Fetch seeing the name claimed by content
          # whose digest is not the pin.
          if sudo ./bin/kanea install --bundle forged --only buildkit --prefix /tmp/forged-prefix; then
            echo "a forged bundle installed without complaint"; exit 1
          fi
          echo "refused: the name matched, the digest did not"
      - name: Journal on failure
        if: failure()
        run: sudo journalctl -u kanea-containerd --no-pager -n 200

  install-smoke-airgapped:
    # The job that matters for the offline path. `unshare -rn` gives the
    # install a network namespace with no interface but loopback, so a code
    # path that reaches for the network *fails* rather than quietly succeeding
    # through a fallback. A mocked "offline" would pass while the real thing
    # dialled out.
    name: "Install smoke: air-gapped"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o ./bin/kanea ./cmd/kanea
      # Authored with a network, as an operator would on a connected machine.
      # --no-images keeps this job to the artefact path; the image half needs a
      # containerd to export from and is covered by the release workflow.
      - name: Author a bundle
        run: ./bin/kanea bundle create --arch amd64 --no-images -o bundle.tar.gz
      - name: Install from it with no network at all
        run: |
          set -euo pipefail
          sudo unshare -rn -- \
            ./bin/kanea install --bundle bundle.tar.gz \
              --only containerd,runc \
              --skip-units
          test -x /usr/local/lib/kanea/bin/containerd
          test -x /usr/local/lib/kanea/bin/runc
      # A bundle is not trusted more than the network: its contents are checked
      # against the hashes in the binary. Corrupting one must be caught.
      - name: A tampered bundle is refused
        run: |
          set -euo pipefail
          mkdir -p tampered && tar -C tampered -xzf bundle.tar.gz
          echo "not containerd" > tampered/artefacts/containerd
          sudo rm -rf /usr/local/lib/kanea
          if sudo unshare -rn -- ./bin/kanea install --bundle tampered \
               --only containerd --skip-units; then
            echo "a tampered bundle installed without complaint"; exit 1
          fi
          test ! -e /usr/local/lib/kanea/bin/containerd
          echo "refused, and nothing was written"

  # The Homebrew formula's CI moved with it to m18h/homebrew-kanea
  # (PRD §5.2.12, v1.67): style, regenerate-and-diff and install-test run
  # in the tap repository, beside the file they verify.

  lint:
    name: "Lint: golangci-lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  security:
    name: "Security gates: gosec, govulncheck, gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs full history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        uses: securego/gosec@2eb4727ebc7504944ddbcdd2f7157db492026c3f # master
        with:
          args: -quiet ./...
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-package: ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action requires the token on pull_request events to resolve
          # the commit range; the default workflow token is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dashboard:
    name: "Dashboard: lint, typecheck, test, build, audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
